name: nonqueue_app
description: Non Queue Application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  crypto: ^3.0.6
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.3
  get: ^4.7.2
  json_annotation: ^4.9.0
  carousel_slider: ^5.0.0
  dio: ^5.8.0+1
  flutter_native_splash: ^2.4.4
  dotted_line: ^3.2.3
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.10.1
  location: ^8.0.0
  sliding_up_panel: ^2.0.0+1
  flutter_contacts: ^1.1.9+2
  sign_in_with_apple: ^6.1.4
  pretty_dio_logger: ^1.4.0
  google_sign_in: ^6.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  file: ^7.0.1
  # Transitive from older plugins; 2.0.6 lacks `namespace` required by AGP 8+
  flutter_plugin_android_lifecycle: ^2.0.28

flutter_icons:
  android: true
  ios: true
  image_path: "assets/splash/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/splash/
    - assets/flags/
